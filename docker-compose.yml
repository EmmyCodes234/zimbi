services:
  postgres:
    image: postgres:16-alpine
    container_name: zimbi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zimbi
      POSTGRES_USER: zimbi
      POSTGRES_PASSWORD: zimbi_password
    ports:
      - "5432:5432"
    volumes:
      - zimbi_pgdata:/var/lib/postgresql/data

volumes:
  zimbi_pgdata:
