databases:
  - name: zimbi-db
    databaseName: zimbi
    user: zimbi
    region: oregon
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: zimbi-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ZIMBI_ENVIRONMENT
        value: test
      - key: DATABASE_URL
        fromDatabase:
          name: zimbi-db
          property: connectionString
      - key: PAYSTACK_TEST_SECRET_KEY
        sync: false
